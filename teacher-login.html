<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Login</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eef4ff;
    font-family:Arial,Helvetica,sans-serif;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#1d4ed8;
    margin-top:0;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    color:#374151;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
    margin-bottom:18px;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.message{
    margin-top:15px;
    text-align:center;
    color:#dc2626;
    font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>Teacher Login</h1>

    <div class="subtitle">
        Assignment Management Portal
    </div>

    <label>Email</label>

    <input
        type="email"
        id="email"
        placeholder="Enter teacher email"
    >

    <label>Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button onclick="teacherLogin()">
        Login
    </button>

    <div id="message" class="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const db = window.supabase.createClient(
    "https://cfhhcmyfewvvdylqvcdg.supabase.co",
    "YOUR_EXISTING_PUBLISHABLE_KEY"
);

async function teacherLogin(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.innerText = "";

    if(!email || !password){

        message.innerText =
            "Please enter email and password.";

        return;
    }

    /* ONLY ALLOW TEACHER EMAIL */

    if(email.toLowerCase() !==
       "anilkumarky.ap@gmail.com"){

        message.innerText =
            "Access denied. Teacher account required.";

        return;
    }

    const {
        data,
        error
    } = await db.auth.signInWithPassword({

        email:email,

        password:password

    });

    if(error){

        message.innerText =
            "Invalid email or password.";

        return;
    }

    localStorage.setItem(
        "teacher_logged_in",
        "true"
    );

    window.location.href =
        "teacher.html";
}

</script>

</body>
</html>
