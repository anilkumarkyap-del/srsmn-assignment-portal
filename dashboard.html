<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Assignments</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef4ff;
    margin:0;
    padding:30px;
}
.container{
    max-width:800px;
    margin:auto;
}
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}
.badge{
    background:#2563eb;
    color:white;
    padding:8px 15px;
    border-radius:20px;
}
.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}
input[type=file]{
    margin:10px 0;
}
button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
    <h2>My Assignments</h2>
    <div class="badge" id="sem">Semester</div>
</div>

<p id="reg"></p>

<div id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const db = window.supabase.createClient(
  "https://cfhhcmyfewvvdylqvcdg.supabase.co",
  "sb_publishable_54d-5PRIOoE5gQ3HtHyAUg_5N1Cjh7F"
);

const semester = localStorage.getItem("semester");
const reg = localStorage.getItem("reg_no");

document.getElementById("sem").innerHTML = "Semester " + semester;
document.getElementById("reg").innerHTML = "Register No : " + reg;

async function loadAssignments(){

 const {data,error} = await db
 .from("assignments")
 .select("*")
 .eq("semester",Number(semester));

 if(error){
   alert(error.message);
   return;
 }

 let html="";

 data.forEach(a=>{

 html += `
 <div class="card">
   <h3>${a.title}</h3>
   <p><b>Subject:</b> ${a.subject}</p>
   <p><b>Due Date:</b> ${a.due_date}</p>

   <input type="file" id="file${a.id}" accept=".pdf"><br>

   <button onclick="uploadPDF(${a.id})">
      Upload PDF
   </button>

 </div>
 `;
 });

 document.getElementById("list").innerHTML = html;

}

async function uploadPDF(id){

  const file = document.getElementById("file"+id).files[0];

  if(!file){
    alert("Choose a PDF first");
    return;
  }

  const filename = reg + "_" + id + ".pdf";

  const { error } = await db.storage
    .from("assignments")
    .upload(filename, file, { upsert:true });

  if(error){
    alert(error.message);
    return;
  }

 await db.from("submissions").insert({
  reg_no: reg,
  assignment_id: id,
  pdf_url: filename,
  status: "Submitted"
});

  alert("PDF uploaded successfully!");
}
loadAssignments();

</script>

</body>
</html>
