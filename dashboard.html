<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Assignments</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef4ff;
    margin:0;
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:10px;
    flex-wrap:wrap;
}

.top-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.badge{
    background:#2563eb;
    color:white;
    padding:8px 15px;
    border-radius:20px;
}

.logout-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:9px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.logout-btn:hover{
    background:#b91c1c;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.question-box{
    background:#f8fafc;
    border-left:5px solid #2563eb;
    padding:15px;
    margin:15px 0;
    border-radius:8px;
}

.question-title{
    font-weight:bold;
    color:#1e40af;
    margin-bottom:8px;
}

.question-text{
    white-space:pre-wrap;
    line-height:1.6;
    color:#374151;
}

.pdf-question{
    margin:15px 0;
    padding:12px;
    background:#eff6ff;
    border-radius:8px;
}

.pdf-question button{
    background:#059669;
}

input[type=file]{
    margin:10px 0;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.no-assignments{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    color:#64748b;
}

/* =====================================================
   SUBMISSION / REVIEW STATUS
===================================================== */

.submission-status{
    margin-top:18px;
    padding:15px;
    border-radius:10px;
    background:#f8fafc;
    border:1px solid #e5e7eb;
}

.status-title{
    font-weight:bold;
    margin-bottom:8px;
}

.status-submitted{
    color:#92400e;
    background:#fffbeb;
    border-color:#fde68a;
}

.status-reviewed{
    color:#166534;
    background:#f0fdf4;
    border-color:#bbf7d0;
}

.marks-box{
    margin-top:10px;
    padding:10px 12px;
    background:white;
    border-radius:8px;
    border:1px solid #d1fae5;
    color:#166534;
}

.feedback-box{
    margin-top:10px;
    padding:12px;
    background:white;
    border-radius:8px;
    border:1px solid #d1fae5;
    color:#374151;
    white-space:pre-wrap;
    line-height:1.5;
}

.reviewed-download-btn{
    margin-top:12px;
    background:#7c3aed;
    color:white;
    font-weight:bold;
}


</style>
</head>

<body>

<div class="container">

<div class="top">

    <div class="top-left">

        <h2 style="margin:0;">
            My Assignments
        </h2>

        <div class="badge" id="sem">
            Semester
        </div>

    </div>

    <button
        class="logout-btn"
        onclick="studentLogout()">

        🚪 Logout

    </button>

</div>

<p id="reg"></p>

<div id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const db = window.supabase.createClient(
  "https://cfhhcmyfewvvdylqvcdg.supabase.co",
  "sb_publishable_54d-5PRIOoE5gQ3HtHyAUg_5N1Cjh7F"
);

const semester = localStorage.getItem("semester");
const reg = localStorage.getItem("reg_no");

/*
   Stores the student's submission records.
   Key = assignment_id
*/
let submissionMap = {};

document.getElementById("sem").innerHTML =
    "Semester " + (semester || "");

document.getElementById("reg").innerHTML =
    "Register No : " + (reg || "");


/* =====================================================
   STUDENT LOGOUT
===================================================== */

async function studentLogout(){

    const confirmed = confirm(
        "Are you sure you want to logout?"
    );

    if(!confirmed){
        return;
    }

    try{

        const { error } =
            await db.auth.signOut();

        if(error){

            alert(
                "Unable to logout:\n\n" +
                error.message
            );

            return;
        }

        /*
           Remove only temporary browser
           login information.

           This does NOT delete the student,
           submissions, marks or database records.
        */

        localStorage.removeItem("semester");
        localStorage.removeItem("reg_no");

        window.location.href =
            "student.html";

    }catch(error){

        alert(
            "Unable to logout:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   LOAD STUDENT SUBMISSIONS
   Gets marks, status and teacher remarks
===================================================== */

async function loadStudentSubmissions(){

    submissionMap = {};

    if(!reg){
        return;
    }

    const {
        data,
        error
    } = await db
        .from("submissions")
        .select("*")
        .eq("reg_no", reg);

    if(error){

        console.error(
            "SUBMISSION LOAD ERROR:",
            error
        );

        return;
    }

    /*
       If more than one record exists for the same
       assignment, use the latest record returned.
    */
    if(data){

        data.forEach(submission => {

            submissionMap[
                String(submission.assignment_id)
            ] = submission;

        });

    }

}


/* =====================================================
   CREATE SUBMISSION STATUS HTML
===================================================== */

function getSubmissionStatusHTML(assignmentId){

    const submission =
        submissionMap[String(assignmentId)];

    /*
       No submission yet
    */
    if(!submission){

        return "";

    }


    /*
       Assignment submitted but not reviewed
    */
    if(
        submission.status !== "Reviewed"
    ){

        return `

        <div class="submission-status status-submitted">

            <div class="status-title">
                ⏳ Assignment Submitted
            </div>

            <div>
                Your assignment has been submitted and is
                waiting for teacher review.
            </div>

        </div>

        `;

    }


    /*
       Assignment reviewed
    */

    let marksHTML = "";

    if(
        submission.marks !== null &&
        submission.marks !== undefined &&
        submission.marks !== ""
    ){

        marksHTML = `

        <div class="marks-box">

            <strong>Marks:</strong>
            ${escapeHTML(submission.marks)}

        </div>

        `;

    }


    let feedbackHTML = "";

    if(
        submission.remarks !== null &&
        submission.remarks !== undefined &&
        String(submission.remarks).trim() !== ""
    ){

        feedbackHTML = `

        <div class="feedback-box">

            <strong>Teacher Feedback:</strong><br><br>

            ${escapeHTML(submission.remarks)}

        </div>

        `;

    }else{

        feedbackHTML = `

        <div class="feedback-box">

            <strong>Teacher Feedback:</strong><br><br>

            No feedback provided.

        </div>

        `;

    }


    let reviewedPdfHTML = "";

    if(submission.reviewed_pdf_url){

        reviewedPdfHTML = `
            <button
                class="reviewed-download-btn"
                onclick="downloadReviewedPDF('${escapeHTML(submission.reviewed_pdf_url)}')">
                📄 Download Reviewed PDF
            </button>
        `;

    }else{

        reviewedPdfHTML = `
            <div style="margin-top:12px;color:#64748b;font-size:13px;">
                The reviewed PDF is not available yet. Please check again after the teacher generates it.
            </div>
        `;

    }

    return `

    <div class="submission-status status-reviewed">

        <div class="status-title">
            ✅ Assignment Reviewed
        </div>

        ${marksHTML}

        ${feedbackHTML}

        ${reviewedPdfHTML}

    </div>

    `;

}


/* =====================================================
   LOAD ASSIGNMENTS
===================================================== */

async function loadAssignments(){

    const {data,error} = await db
        .from("assignments")
        .select("*")
        .eq("semester",Number(semester));

    if(error){

        alert(error.message);
        return;
    }


    let html = "";


    if(!data || data.length === 0){

        html = `
        <div class="no-assignments">
            <h3>No assignments available</h3>
            <p>There are currently no assignments for your semester.</p>
        </div>
        `;

        document.getElementById("list").innerHTML = html;

        return;
    }


    data.forEach(a => {

        /* ---------------------------------------------
           QUESTION TEXT
        --------------------------------------------- */

        let questionHTML = "";

        if(a.question_text){

            questionHTML = `
            <div class="question-box">

                <div class="question-title">
                    📋 Questions / Instructions
                </div>

                <div class="question-text">
                    ${escapeHTML(a.question_text)}
                </div>

            </div>
            `;
        }


        /* ---------------------------------------------
           QUESTION PDF
        --------------------------------------------- */

        let questionPDFHTML = "";

        if(a.question_pdf_url){

            questionPDFHTML = `
            <div class="pdf-question">

                <b>📄 Question Paper / Instructions</b>

                <br><br>

                <button
                    onclick="downloadQuestionPDF('${escapeHTML(a.question_pdf_url)}')">

                    Download Question PDF

                </button>

            </div>
            `;
        }


        /* ---------------------------------------------
           SUBMISSION STATUS
        --------------------------------------------- */

        const submissionStatusHTML =
            getSubmissionStatusHTML(a.id);


        /* ---------------------------------------------
           ASSIGNMENT CARD
        --------------------------------------------- */

        html += `

        <div class="card">

            <h3>${escapeHTML(a.title)}</h3>

            <p>
                <b>Subject:</b>
                ${escapeHTML(a.subject)}
            </p>

            <p>
                <b>Due Date:</b>
                ${a.due_date}
            </p>


            ${questionHTML}

            ${questionPDFHTML}


            <hr style="
                border:none;
                border-top:1px solid #e5e7eb;
                margin:20px 0;
            ">


            <h4>Submit Your Assignment</h4>

            <input
                type="file"
                id="file${a.id}"
                accept=".pdf,application/pdf"
            >

            <br>

            <button
                onclick="uploadPDF(${a.id})">

                Upload PDF

            </button>

            ${submissionStatusHTML}

        </div>

        `;

    });


    document.getElementById("list").innerHTML = html;

}


/* =====================================================
   DOWNLOAD QUESTION PDF
===================================================== */

async function downloadQuestionPDF(filePath){

    if(!filePath){

        alert("Question PDF not found.");
        return;
    }


    const {
        data,
        error
    } = await db
        .storage
        .from("assignments")
        .createSignedUrl(
            filePath,
            3600
        );


    if(error){

        alert(
            "Unable to open Question PDF:\n\n" +
            error.message
        );

        return;
    }


    window.open(
        data.signedUrl,
        "_blank"
    );

}


/* =====================================================
   DOWNLOAD REVIEWED PDF
===================================================== */

async function downloadReviewedPDF(filePath){

    if(!filePath){
        alert("Reviewed PDF is not available yet.");
        return;
    }

    const { data, error } = await db
        .storage
        .from("assignments")
        .createSignedUrl(filePath, 3600);

    if(error){
        alert("Unable to open Reviewed PDF:\\n\\n" + error.message);
        return;
    }

    window.open(data.signedUrl, "_blank");

}


/* =====================================================
   UPLOAD STUDENT PDF
===================================================== */

async function uploadPDF(id){

    const file =
        document.getElementById(
            "file" + id
        ).files[0];


    if(!file){

        alert("Choose a PDF first");
        return;
    }


    if(file.type !== "application/pdf"){

        alert("Please select a PDF file.");
        return;
    }


    const filename =
        reg + "_" + id + ".pdf";


    const {
        error
    } = await db.storage
        .from("assignments")
        .upload(
            filename,
            file,
            {
                upsert:true
            }
        );


    if(error){

        alert(error.message);
        return;
    }


    const {
        data: submissionData,
        error: submissionError
    } =
        await db
        .from("submissions")
        .insert({

            reg_no: reg,

            assignment_id: id,

            pdf_url: filename,

            status: "Submitted"

        })
        .select();


    if(submissionError){

        alert(
            "PDF uploaded, but submission record failed:\n\n" +
            submissionError.message
        );

        console.error(
            "SUBMISSION ERROR:",
            submissionError
        );

        return;
    }


    /*
       Update the local submission map so the new
       submission status appears immediately.
    */

    if(
        submissionData &&
        submissionData.length > 0
    ){

        submissionMap[String(id)] =
            submissionData[0];

    }


    /*
       Refresh the assignment cards so the
       "Assignment Submitted" message appears.
    */

    await loadAssignments();


    alert(
        "PDF uploaded and submission recorded successfully!"
    );

}


/* =====================================================
   ESCAPE HTML
   Prevents question text / feedback from being
   interpreted as HTML
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   START
===================================================== */

async function startDashboard(){

    /*
       First load the student's submissions.
       Then load assignments so marks/feedback can
       be displayed inside the correct assignment card.
    */

    await loadStudentSubmissions();

    await loadAssignments();

}

startDashboard();

</script>

</body>
</html>
