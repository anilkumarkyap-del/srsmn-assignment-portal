<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Teacher Portal</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#eef4ff;
    font-family:Arial,sans-serif;
    padding:25px;
}

.container{
    max-width:1200px;
    margin:auto;
}

/* CREATE ASSIGNMENT */

.card{
    background:white;
    padding:25px;
    margin-bottom:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#2563eb;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    padding:10px 16px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:7px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

/* FILTER AREA */

.filters{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

.stats{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.stat{
    flex:1;
    min-width:150px;
    padding:18px;
    border-radius:10px;
    text-align:center;
    background:#f1f5f9;
}

.stat strong{
    display:block;
    font-size:24px;
    color:#2563eb;
    margin-top:5px;
}

/* TABLE */

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#2563eb;
    color:white;
    padding:13px 10px;
    text-align:center;
}

td{
    padding:12px 10px;
    border-bottom:1px solid #ddd;
    text-align:center;
    background:white;
}

tr:hover td{
    background:#f8fafc;
}

/* STATUS */

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.submitted{
    background:#fef3c7;
    color:#92400e;
}

.reviewed{
    background:#dcfce7;
    color:#166534;
}

/* PDF BUTTON */

.pdf-btn{
    background:#7c3aed;
    font-size:13px;
}

.pdf-btn:hover{
    background:#6d28d9;
}

/* REVIEW BUTTON */

.review-btn{
    background:#059669;
    font-size:13px;
}

.review-btn:hover{
    background:#047857;
}

.edit-btn{
    background:#f59e0b;
}

.edit-btn:hover{
    background:#d97706;
}

/* MARK INPUT */

.mark-input{
    width:80px;
    padding:7px;
    margin:0;
    text-align:center;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

/* MOBILE */

@media(max-width:700px){

    body{
        padding:10px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .card{
        padding:15px;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ============================= -->
<!-- CREATE ASSIGNMENT -->
<!-- ============================= -->

<div class="card">

<h2>Create Assignment</h2>


<input
id="title"
placeholder="Assignment Title">


<input
id="subject"
placeholder="Subject Name">


<select id="semester">

<option value="">
Select Semester
</option>

<option value="1">
I Semester
</option>

<option value="2">
II Semester
</option>

<option value="3">
III Semester
</option>

<option value="4">
IV Semester
</option>

<option value="5">
V Semester
</option>

<option value="6">
VI Semester
</option>

</select>


<label>Due Date</label>

<input
id="due"
type="date">


<button
onclick="createAssignment()">

Publish Assignment

</button>

</div>



<!-- ============================= -->
<!-- STUDENT SUBMISSIONS -->
<!-- ============================= -->

<div class="card">

<h2>Student Submissions</h2>


<!-- FILTERS -->

<div class="filters">

<div>

<label>
<b>Select Assignment</b>
</label>

<select
id="assignmentFilter"
onchange="loadSubmissions()">

<option value="">
All Assignments
</option>

</select>

</div>


<div>

<label>
<b>Search Register Number</b>
</label>

<input
id="searchReg"
placeholder="Enter register number"
oninput="displaySubmissions()">

</div>

</div>



<!-- STATISTICS -->

<div class="stats">

<div class="stat">

Total Submissions

<strong id="totalCount">
0
</strong>

</div>


<div class="stat">

Pending Review

<strong id="pendingCount">
0
</strong>

</div>


<div class="stat">

Reviewed

<strong id="reviewedCount">
0
</strong>

</div>

</div>



<button
onclick="loadSubmissions()">

🔄 Refresh Submissions

</button>


<br>
<br>


<!-- TABLE -->

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>#</th>

<th>Register No.</th>

<th>Student Name</th>

<th>Assignment</th>

<th>Status</th>

<th>PDF</th>

<th>Marks</th>

<th>Action</th>

</tr>

</thead>


<tbody id="submissionTable">

<tr>

<td colspan="8">

Loading submissions...

</td>

</tr>

</tbody>

</table>

</div>


</div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<!-- YOUR EXISTING APP.JS -->

<script src="app.js"></script>



<script>


/* =========================================
   GLOBAL DATA
========================================= */

let allSubmissions = [];

let allAssignments = [];

let allStudents = [];



/* =========================================
   LOAD ASSIGNMENTS FOR DROPDOWN
========================================= */

async function loadAssignments(){

    const {
        data,
        error
    } = await db
        .from("assignments")
        .select("*")
        .order("id",{ascending:true});


    if(error){

        alert(
            "Unable to load assignments:\n\n"
            + error.message
        );

        return;
    }


    allAssignments = data || [];


    const dropdown =
        document.getElementById(
            "assignmentFilter"
        );


    dropdown.innerHTML =
        '<option value="">All Assignments</option>';


    allAssignments.forEach(function(a){

        dropdown.innerHTML += `

        <option value="${a.id}">

            ${a.title} - ${a.subject}

        </option>

        `;

    });

}



/* =========================================
   LOAD STUDENTS
========================================= */

async function loadStudents(){

    const {
        data,
        error
    } = await db
        .from("students")
        .select("reg_no,name");


    if(error){

        console.log(
            "Student loading error:",
            error.message
        );

        allStudents = [];

        return;
    }


    allStudents = data || [];

}



/* =========================================
   LOAD SUBMISSIONS
========================================= */

async function loadSubmissions(){

    const table =
        document.getElementById(
            "submissionTable"
        );


    table.innerHTML = `

        <tr>

            <td colspan="8">

                Loading submissions...

            </td>

        </tr>

    `;


    /* Load assignments */

    const {
        data: assignments,
        error: assignmentError
    } = await db
        .from("assignments")
        .select("*");


    if(assignmentError){

        table.innerHTML = `

        <tr>

            <td colspan="8">

                Error loading assignments:
                ${assignmentError.message}

            </td>

        </tr>

        `;

        return;
    }


    allAssignments =
        assignments || [];


    /* Load students */

    await loadStudents();


    /* Load submissions */

    const {
        data: submissions,
        error: submissionError
    } = await db
        .from("submissions")
        .select("*")
        .order("id",{ascending:false});


    if(submissionError){

        table.innerHTML = `

        <tr>

            <td colspan="8">

                Error loading submissions:
                ${submissionError.message}

            </td>

        </tr>

        `;

        return;
    }


    allSubmissions =
        submissions || [];


    populateAssignmentDropdown();


    displaySubmissions();

}



/* =========================================
   ASSIGNMENT DROPDOWN
========================================= */

function populateAssignmentDropdown(){

    const dropdown =
        document.getElementById(
            "assignmentFilter"
        );


    const currentValue =
        dropdown.value;


    dropdown.innerHTML =
        '<option value="">All Assignments</option>';


    allAssignments.forEach(function(a){

        dropdown.innerHTML += `

        <option value="${a.id}">

            ${a.title} - ${a.subject}

        </option>

        `;

    });


    dropdown.value =
        currentValue;

}



/* =========================================
   DISPLAY TABLE
========================================= */

function displaySubmissions(){

    const table =
        document.getElementById(
            "submissionTable"
        );


    const selectedAssignment =
        document.getElementById(
            "assignmentFilter"
        ).value;


    const search =
        document.getElementById(
            "searchReg"
        ).value
        .trim()
        .toLowerCase();


    let filtered =
        allSubmissions.filter(
            function(submission){

                const assignmentMatch =
                    !selectedAssignment ||
                    String(
                        submission.assignment_id
                    ) ===
                    String(
                        selectedAssignment
                    );


                const registerMatch =
                    !search ||
                    String(
                        submission.reg_no
                    )
                    .toLowerCase()
                    .includes(search);


                return
                    assignmentMatch &&
                    registerMatch;

            }
        );


    /* STATISTICS */

    const total =
        filtered.length;


    const reviewed =
        filtered.filter(
            s =>
            s.status === "Reviewed"
        ).length;


    const pending =
        total - reviewed;


    document.getElementById(
        "totalCount"
    ).innerText = total;


    document.getElementById(
        "pendingCount"
    ).innerText = pending;


    document.getElementById(
        "reviewedCount"
    ).innerText = reviewed;



    /* NO RECORDS */

    if(filtered.length === 0){

        table.innerHTML = `

        <tr>

            <td colspan="8">

                <div class="empty">

                    No submissions found.

                </div>

            </td>

        </tr>

        `;

        return;

    }



    let html = "";


    filtered.forEach(
        function(submission,index){

            /* FIND ASSIGNMENT */

            const assignment =
                allAssignments.find(
                    a =>
                    String(a.id) ===
                    String(
                        submission.assignment_id
                    )
                );


            /* FIND STUDENT */

            const student =
                allStudents.find(
                    s =>
                    String(s.reg_no) ===
                    String(
                        submission.reg_no
                    )
                );


            const studentName =
                student
                ? student.name
                : "Student";


            const assignmentName =
                assignment
                ? assignment.title
                : "Unknown";


            const subject =
                assignment
                ? assignment.subject
                : "";


            const isReviewed =
                submission.status ===
                "Reviewed";


            const statusHTML =
                isReviewed

                ?

                `<span class="status reviewed">
                    Reviewed
                </span>`

                :

                `<span class="status submitted">
                    Submitted
                </span>`;


            html += `

            <tr>


                <td>
                    ${index + 1}
                </td>


                <td>
                    <b>
                    ${submission.reg_no}
                    </b>
                </td>


                <td>
                    ${studentName}
                </td>


                <td>

                    <b>
                    ${assignmentName}
                    </b>

                    <br>

                    <small>
                    ${subject}
                    </small>

                </td>


                <td>

                    ${statusHTML}

                </td>


                <td>

                    <button
                    class="pdf-btn"
                    onclick="viewPDF('${submission.pdf_url}')">

                    View PDF

                    </button>

                </td>


                <td>

                    <input
                    class="mark-input"
                    type="number"
                    min="0"
                    max="100"
                    value="${submission.marks ?? ''}"
                    placeholder="—"
                    id="marks_${submission.id}">

                </td>


                <td>

                    <button

                    class="${
                        isReviewed
                        ? 'edit-btn'
                        : 'review-btn'
                    }"

                    onclick="
                    saveMarks(${submission.id})
                    ">

                    ${
                        isReviewed
                        ? 'Update'
                        : 'Review'
                    }

                    </button>

                </td>


            </tr>

            `;

        }
    );


    table.innerHTML =
        html;

}



/* =========================================
   VIEW PDF
========================================= */

async function viewPDF(filename){

    if(!filename){

        alert(
            "PDF file not found."
        );

        return;
    }


    const {
        data,
        error
    } = await db
        .storage
        .from("assignments")
        .createSignedUrl(
            filename,
            3600
        );


    if(error){

        alert(
            "Unable to open PDF:\n\n"
            + error.message
        );

        return;
    }


    window.open(
        data.signedUrl,
        "_blank"
    );

}



/* =========================================
   SAVE MARKS
========================================= */

async function saveMarks(id){

    const input =
        document.getElementById(
            "marks_" + id
        );


    const marks =
        input.value.trim();


    if(marks === ""){

        alert(
            "Please enter marks."
        );

        return;
    }


    if(
        Number(marks) < 0 ||
        Number(marks) > 100
    ){

        alert(
            "Marks should be between 0 and 100."
        );

        return;
    }


    const {
        error
    } = await db
        .from("submissions")
        .update({

            marks:
                Number(marks),

            status:
                "Reviewed"

        })
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "Unable to save marks:\n\n"
            + error.message
        );

        return;
    }


    alert(
        "Review completed successfully!"
    );


    await loadSubmissions();

}



/* =========================================
   START PAGE
========================================= */

loadSubmissions();

</script>


</body>

</html>
