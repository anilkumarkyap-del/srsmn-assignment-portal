<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Portal</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================
   PAGE
========================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:25px;
    background:#eef4ff;
    font-family:Arial, Helvetica, sans-serif;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container{
    width:100%;
    max-width:none;
    margin:0 auto;
}


/* =========================================
   CARDS
========================================= */

.card{
    width:100%;
    max-width:none;

    background:white;

    padding:25px;

    margin-bottom:25px;

    border-radius:15px;

    box-shadow:0 8px 20px rgba(0,0,0,0.10);
}


/* =========================================
   HEADINGS
========================================= */

h1{
    text-align:center;
    color:#1d4ed8;
    margin-top:0;
}

h2{
    text-align:center;
    color:#2563eb;
    margin-top:0;
    margin-bottom:25px;
}


/* =========================================
   FORM
========================================= */

.form-grid{
    display:grid;

    grid-template-columns:
        2fr
        2fr
        1fr
        1fr;

    gap:15px;

    align-items:end;
}

.form-group{
    width:100%;
}

.form-group label{
    display:block;

    font-weight:bold;

    margin-bottom:7px;

    color:#374151;
}

input,
select{
    width:100%;

    padding:12px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    font-size:15px;

    background:white;
}

input:focus,
select:focus{
    outline:none;

    border-color:#2563eb;

    box-shadow:0 0 0 2px rgba(37,99,235,.12);
}


/* =========================================
   BUTTONS
========================================= */

button{
    border:none;

    padding:11px 16px;

    border-radius:8px;

    background:#2563eb;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.publish-btn{
    width:100%;

    height:43px;
}

.refresh-btn{
    background:#059669;
}

.refresh-btn:hover{
    background:#047857;
}

.pdf-btn{
    background:#7c3aed;

    padding:8px 12px;

    font-size:13px;
}

.pdf-btn:hover{
    background:#6d28d9;
}

.review-btn{
    background:#059669;

    padding:8px 12px;

    font-size:13px;
}

.review-btn:hover{
    background:#047857;
}

.update-btn{
    background:#f59e0b;

    padding:8px 12px;

    font-size:13px;
}

.update-btn:hover{
    background:#d97706;
}


/* =========================================
   FILTER AREA
========================================= */

.filter-area{

    display:grid;

    grid-template-columns:
        1fr
        1fr
        auto;

    gap:15px;

    align-items:end;

    margin-bottom:20px;
}

.filter-group label{

    display:block;

    font-weight:bold;

    margin-bottom:7px;

    color:#374151;
}


/* =========================================
   STATISTICS
========================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:20px;
}

.stat-box{

    background:#f8fafc;

    border:1px solid #e2e8f0;

    border-radius:12px;

    padding:18px;

    text-align:center;
}

.stat-title{

    color:#475569;

    font-size:15px;
}

.stat-number{

    display:block;

    margin-top:7px;

    font-size:28px;

    font-weight:bold;

    color:#2563eb;
}

.pending-number{
    color:#d97706;
}

.reviewed-number{
    color:#059669;
}


/* =========================================
   TABLE SECTION
========================================= */

.table-heading{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    gap:15px;

    flex-wrap:wrap;
}


/* =========================================
   FULL WIDTH TABLE
========================================= */

.table-container{

    width:100%;

    overflow-x:auto;

    border:1px solid #dbeafe;

    border-radius:10px;
}


/*
   The table is intentionally wide.
   On smaller screens the user can scroll horizontally.
*/

table{

    width:100%;

    min-width:1100px;

    border-collapse:collapse;

    background:white;
}


/* =========================================
   TABLE HEADER
========================================= */

thead th{

    background:#2563eb;

    color:white;

    padding:14px 12px;

    font-size:14px;

    text-align:center;

    white-space:nowrap;

    border-right:1px solid rgba(255,255,255,.2);
}


/* =========================================
   TABLE BODY
========================================= */

tbody td{

    padding:13px 12px;

    border-bottom:1px solid #e5e7eb;

    text-align:center;

    white-space:nowrap;

    font-size:14px;
}

tbody tr:hover td{

    background:#f8fafc;
}


/* =========================================
   STUDENT NAME
========================================= */

.student-name{

    font-weight:bold;

    color:#1e293b;
}


/* =========================================
   REGISTER NUMBER
========================================= */

.reg-number{

    font-weight:bold;

    color:#1d4ed8;
}


/* =========================================
   ASSIGNMENT
========================================= */

.assignment-title{

    font-weight:bold;

    color:#334155;
}

.subject{

    color:#64748b;

    font-size:12px;

    margin-top:3px;
}


/* =========================================
   STATUS
========================================= */

.status{

    display:inline-block;

    padding:6px 11px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;
}

.status-submitted{

    background:#fef3c7;

    color:#92400e;
}

.status-reviewed{

    background:#dcfce7;

    color:#166534;
}


/* =========================================
   MARK INPUT
========================================= */

.mark-input{

    width:75px !important;

    padding:8px !important;

    margin:0 !important;

    text-align:center;

    font-weight:bold;
}


/* =========================================
   EMPTY MESSAGE
========================================= */

.empty{

    padding:45px;

    text-align:center;

    color:#64748b;

    font-size:16px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:900px){

    body{

        padding:10px;

    }

    .form-grid{

        grid-template-columns:1fr;

    }

    .filter-area{

        grid-template-columns:1fr;

    }

    .stats{

        grid-template-columns:1fr;

    }

    .card{

        padding:15px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     TEACHER HEADER
===================================================== -->

<div class="card">

<h1>Teacher Portal</h1>

<p style="
text-align:center;
color:#64748b;
margin-top:-15px;
">
Assignment Management & Student Submissions
</p>

</div>



<!-- =====================================================
     CREATE ASSIGNMENT
===================================================== -->

<div class="card">

<h2>Create Assignment</h2>


<div class="form-grid">


<!-- TITLE -->

<div class="form-group">

<label>
Assignment Title
</label>

<input
id="title"
placeholder="Example: Assignment 1">

</div>


<!-- SUBJECT -->

<div class="form-group">

<label>
Subject
</label>

<input
id="subject"
placeholder="Example: IFRS">

</div>


<!-- SEMESTER -->

<div class="form-group">

<label>
Semester
</label>

<select id="semester">

<option value="">
Select Semester
</option>

<option value="1">
I Semester
</option>

<option value="2">
II Semester
</option>

<option value="3">
III Semester
</option>

<option value="4">
IV Semester
</option>

<option value="5">
V Semester
</option>

<option value="6">
VI Semester
</option>

</select>

</div>


<!-- DUE DATE -->

<div class="form-group">

<label>
Due Date
</label>

<input
id="due"
type="date">

</div>


</div>


<br>


<button
class="publish-btn"
onclick="createAssignment()">

Publish Assignment

</button>


</div>



<!-- =====================================================
     STUDENT SUBMISSIONS
===================================================== -->

<div class="card">


<h2>
Student Submissions
</h2>



<!-- FILTERS -->

<div class="filter-area">


<!-- ASSIGNMENT FILTER -->

<div class="filter-group">

<label>
Select Assignment
</label>

<select
id="assignmentFilter"
onchange="displaySubmissions()">

<option value="">
All Assignments
</option>

</select>

</div>


<!-- SEARCH -->

<div class="filter-group">

<label>
Search Register Number
</label>

<input
id="searchReg"
placeholder="Enter register number"
oninput="displaySubmissions()">

</div>


<!-- REFRESH -->

<div>

<button
class="refresh-btn"
onclick="loadAllData()">

🔄 Refresh

</button>

</div>


</div>



<!-- =====================================================
     STATISTICS
===================================================== -->

<div class="stats">


<div class="stat-box">

<span class="stat-title">
Total Submissions
</span>

<span
class="stat-number"
id="totalCount">

0

</span>

</div>


<div class="stat-box">

<span class="stat-title">
Pending Review
</span>

<span
class="stat-number pending-number"
id="pendingCount">

0

</span>

</div>


<div class="stat-box">

<span class="stat-title">
Reviewed
</span>

<span
class="stat-number reviewed-number"
id="reviewedCount">

0

</span>

</div>


</div>



<!-- =====================================================
     TABLE
===================================================== -->

<div class="table-heading">

<div>

<strong>
Submission List
</strong>

<span
id="recordInfo"
style="color:#64748b;">
</span>

</div>

</div>


<div class="table-container">


<table>


<thead>

<tr>

<th>
#
</th>

<th>
Register No.
</th>

<th>
Student Name
</th>

<th>
Assignment
</th>

<th>
Status
</th>

<th>
Submitted PDF
</th>

<th>
Marks
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody
id="submissionTable">

<tr>

<td
colspan="8"
class="empty">

Loading submissions...

</td>

</tr>

</tbody>


</table>

</div>


</div>


</div>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- EXISTING APP.JS -->

<script src="app.js"></script>



<script>


/* =====================================================
   GLOBAL DATA
===================================================== */

let allSubmissions = [];

let allAssignments = [];

let allStudents = [];



/* =====================================================
   LOAD ALL DATA
===================================================== */

async function loadAllData(){

    const table =
        document.getElementById(
            "submissionTable"
        );


    table.innerHTML = `

        <tr>

            <td
            colspan="8"
            class="empty">

                Loading submissions...

            </td>

        </tr>

    `;


    /* ---------------------------------------------
       LOAD ASSIGNMENTS
    --------------------------------------------- */

    const {
        data: assignments,
        error: assignmentError
    } = await db
        .from("assignments")
        .select("*")
        .order("id", {
            ascending:true
        });


    if(assignmentError){

        table.innerHTML = `

        <tr>

            <td
            colspan="8"
            class="empty">

                Error loading assignments:
                ${assignmentError.message}

            </td>

        </tr>

        `;

        return;
    }


    allAssignments =
        assignments || [];


    /* ---------------------------------------------
       LOAD STUDENTS
    --------------------------------------------- */

    const {
        data: students,
        error: studentError
    } = await db
        .from("students")
        .select(
            "reg_no,name"
        );


    if(studentError){

        console.log(
            "Student loading error:",
            studentError.message
        );

        allStudents = [];

    }
    else{

        allStudents =
            students || [];

    }


    /* ---------------------------------------------
       LOAD SUBMISSIONS
    --------------------------------------------- */

    const {
        data: submissions,
        error: submissionError
    } = await db
        .from("submissions")
        .select("*")
        .order("id", {
            ascending:false
        });


    if(submissionError){

        table.innerHTML = `

        <tr>

            <td
            colspan="8"
            class="empty">

                Error loading submissions:
                ${submissionError.message}

            </td>

        </tr>

        `;

        return;
    }


    allSubmissions =
        submissions || [];


    /* ---------------------------------------------
       POPULATE ASSIGNMENT FILTER
    --------------------------------------------- */

    populateAssignmentFilter();


    /* ---------------------------------------------
       DISPLAY TABLE
    --------------------------------------------- */

    displaySubmissions();

}



/* =====================================================
   ASSIGNMENT FILTER
===================================================== */

function populateAssignmentFilter(){

    const dropdown =
        document.getElementById(
            "assignmentFilter"
        );


    const oldValue =
        dropdown.value;


    dropdown.innerHTML = `

        <option value="">
            All Assignments
        </option>

    `;


    allAssignments.forEach(
        function(assignment){

            dropdown.innerHTML += `

                <option
                value="${assignment.id}">

                    ${assignment.title}
                    -
                    ${assignment.subject}

                </option>

            `;

        }
    );


    dropdown.value =
        oldValue;

}



/* =====================================================
   DISPLAY SUBMISSIONS
===================================================== */

function displaySubmissions(){

    const table =
        document.getElementById(
            "submissionTable"
        );


    const selectedAssignment =
        document.getElementById(
            "assignmentFilter"
        ).value;


    const search =
        document.getElementById(
            "searchReg"
        ).value
        .trim()
        .toLowerCase();


    /* ---------------------------------------------
       FILTER
    --------------------------------------------- */

    const filtered =
        allSubmissions.filter(
            function(submission){

                const assignmentMatch =
                    !selectedAssignment ||
                    String(
                        submission.assignment_id
                    ) ===
                    String(
                        selectedAssignment
                    );


                const registerMatch =
                    !search ||
                    String(
                        submission.reg_no
                    )
                    .toLowerCase()
                    .includes(search);


                return (
                    assignmentMatch &&
                    registerMatch
                );

            }
        );


    /* ---------------------------------------------
       COUNTS
    --------------------------------------------- */

    const total =
        filtered.length;


    const reviewed =
        filtered.filter(
            function(submission){

                return (
                    submission.status ===
                    "Reviewed"
                );

            }
        ).length;


    const pending =
        total - reviewed;


    document.getElementById(
        "totalCount"
    ).innerText =
        total;


    document.getElementById(
        "pendingCount"
    ).innerText =
        pending;


    document.getElementById(
        "reviewedCount"
    ).innerText =
        reviewed;


    document.getElementById(
        "recordInfo"
    ).innerText =
        " (" + total + " records)";



    /* ---------------------------------------------
       NO SUBMISSIONS
    --------------------------------------------- */

    if(filtered.length === 0){

        table.innerHTML = `

            <tr>

                <td
                colspan="8"
                class="empty">

                    No student submissions found.

                </td>

            </tr>

        `;

        return;

    }



    /* ---------------------------------------------
       BUILD TABLE
    --------------------------------------------- */

    let html = "";


    filtered.forEach(
        function(submission,index){


            /* FIND ASSIGNMENT */

            const assignment =
                allAssignments.find(
                    function(a){

                        return (
                            String(a.id) ===
                            String(
                                submission.assignment_id
                            )
                        );

                    }
                );


            /* FIND STUDENT */

            const student =
                allStudents.find(
                    function(s){

                        return (
                            String(
                                s.reg_no
                            ) ===
                            String(
                                submission.reg_no
                            )
                        );

                    }
                );


            const studentName =
                student
                ? student.name
                : "Name not found";


            const assignmentTitle =
                assignment
                ? assignment.title
                : "Unknown Assignment";


            const subject =
                assignment
                ? assignment.subject
                : "";


            const isReviewed =
                submission.status ===
                "Reviewed";


            /* STATUS */

            const statusHTML =
                isReviewed

                ?

                `
                <span
                class="status status-reviewed">

                    Reviewed

                </span>
                `

                :

                `
                <span
                class="status status-submitted">

                    Submitted

                </span>
                `;



            /* ACTION */

            const actionButton =
                isReviewed

                ?

                `
                <button
                class="update-btn"
                onclick="saveMarks(${submission.id})">

                    Update

                </button>
                `

                :

                `
                <button
                class="review-btn"
                onclick="saveMarks(${submission.id})">

                    Review

                </button>
                `;



            html += `

                <tr>


                    <!-- NUMBER -->

                    <td>
                        ${index + 1}
                    </td>


                    <!-- REGISTER NUMBER -->

                    <td>

                        <span
                        class="reg-number">

                            ${submission.reg_no}

                        </span>

                    </td>


                    <!-- STUDENT NAME -->

                    <td>

                        <span
                        class="student-name">

                            ${studentName}

                        </span>

                    </td>


                    <!-- ASSIGNMENT -->

                    <td>

                        <div
                        class="assignment-title">

                            ${assignmentTitle}

                        </div>

                        <div
                        class="subject">

                            ${subject}

                        </div>

                    </td>


                    <!-- STATUS -->

                    <td>

                        ${statusHTML}

                    </td>


                    <!-- PDF -->

                    <td>

                        <button
                        class="pdf-btn"
                        onclick="
                        viewPDF('${submission.pdf_url}')
                        ">

                            📄 View PDF

                        </button>

                    </td>


                    <!-- MARKS -->

                    <td>

                        <input
                        id="marks_${submission.id}"
                        class="mark-input"
                        type="number"
                        min="0"
                        max="100"
                        value="${
                            submission.marks ?? ""
                        }"
                        placeholder="—">

                    </td>


                    <!-- ACTION -->

                    <td>

                        ${actionButton}

                    </td>


                </tr>

            `;

        }
    );


    table.innerHTML =
        html;

}



/* =====================================================
   VIEW PDF
===================================================== */

async function viewPDF(filename){

    if(!filename){

        alert(
            "PDF file not found."
        );

        return;

    }


    const {
        data,
        error
    } = await db
        .storage
        .from("assignments")
        .createSignedUrl(
            filename,
            3600
        );


    if(error){

        alert(
            "Unable to open PDF:\n\n" +
            error.message
        );

        return;

    }


    window.open(
        data.signedUrl,
        "_blank"
    );

}



/* =====================================================
   SAVE MARKS
===================================================== */

async function saveMarks(id){

    const input =
        document.getElementById(
            "marks_" + id
        );


    if(!input){

        alert(
            "Marks field not found."
        );

        return;

    }


    const marks =
        input.value.trim();


    if(marks === ""){

        alert(
            "Please enter marks."
        );

        return;

    }


    if(
        Number(marks) < 0 ||
        Number(marks) > 100
    ){

        alert(
            "Marks should be between 0 and 100."
        );

        return;

    }


    const {
        error
    } = await db
        .from("submissions")
        .update({

            marks:
                Number(marks),

            status:
                "Reviewed"

        })
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "Unable to save marks:\n\n" +
            error.message
        );

        return;

    }


    alert(
        "Review completed successfully!"
    );


    await loadAllData();

}



/* =====================================================
   INITIAL LOAD
===================================================== */

loadAllData();

</script>


</body>

</html>
